# Local lakehouse: MinIO (S3), a Spark standalone cluster, a Postgres
# warehouse, and Airflow to drive the whole thing.
#
#   make up      -> build and start everything
#   make demo    -> generate synthetic data, seed MinIO, run the full pipeline

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  image: mimic-lakehouse/airflow:1.0.0
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    # Connections as env vars: no manual clicking in the UI to get a demo running.
    AIRFLOW_CONN_SPARK_DEFAULT: >-
      {"conn_type":"spark","host":"spark://spark-master","port":7077,
       "extra":{"deploy-mode":"client","spark-binary":"spark-submit"}}
    AIRFLOW_CONN_WAREHOUSE: postgresql://mimic:mimic@warehouse:5432/mimic
    AIRFLOW_CONN_MINIO: >-
      {"conn_type":"aws","login":"minioadmin","password":"minioadmin",
       "extra":{"endpoint_url":"http://minio:9000","region_name":"us-east-1"}}
    LAKE_ROOT: s3a://mimic-lake
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: minioadmin
    S3_SECRET_KEY: minioadmin
    WAREHOUSE_HOST: warehouse
    WAREHOUSE_PORT: "5432"
    WAREHOUSE_DB: mimic
    WAREHOUSE_USER: mimic
    WAREHOUSE_PASSWORD: mimic
    SPARK_SHUFFLE_PARTITIONS: "16"
    PYTHONPATH: /opt/spark-apps:/opt/airflow/dags
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./spark:/opt/spark-apps
    - ./dbt:/opt/dbt
    - ./ml:/opt/ml
    - ./data:/opt/data
  depends_on:
    airflow-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  # ── Object storage: stands in for S3 ──────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mimic-lake &&
      mc mb --ignore-existing local/mimic-artifacts &&
      echo 'buckets ready'
      "

  # ── Analytical warehouse ──────────────────────────────────────────────────
  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mimic
      POSTGRES_PASSWORD: mimic
      POSTGRES_DB: mimic
    ports:
      - "5433:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimic -d mimic"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Spark standalone cluster ──────────────────────────────────────────────
  spark-master:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    image: mimic-lakehouse/spark:1.0.0
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "7077:7077"
      - "8081:8080"   # Spark master UI
    volumes:
      - ./spark:/opt/spark-apps
      - ./data:/opt/data

  spark-worker:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    image: mimic-lakehouse/spark:1.0.0
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-4G}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    deploy:
      replicas: ${SPARK_WORKERS:-2}
    volumes:
      - ./spark:/opt/spark-apps
      - ./data:/opt/data

  # ── Airflow ───────────────────────────────────────────────────────────────
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Data --lastname Engineer \
          --role Admin --email admin@example.com || true
        echo "airflow initialised"
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  minio-data:
  warehouse-data:
  airflow-db-data:
