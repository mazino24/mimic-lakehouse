name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Spark 3.5 will not start on JDK 21+ without this.
  JDK_JAVA_OPTIONS: -Djava.security.manager=allow
  S3_ENABLED: "false"

jobs:
  lint:
    name: Lint (Python + SQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==0.6.9 sqlfluff==3.2.4
      - name: Ruff
        run: ruff check spark scripts ml airflow
      - name: SQLFluff
        run: sqlfluff lint dbt/models dbt/tests --dialect postgres --nofail

  test:
    name: Spark tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements/dev.txt
      - name: Unit and integration tests
        run: pytest spark/tests -v --cov=spark/lakehouse --cov-report=term-missing
      - name: Synthetic data generator smoke test
        run: |
          python scripts/generate_synthetic_mimic.py --patients 200 --out-dir /tmp/raw
          test -s /tmp/raw/labevents.csv

  dbt:
    name: dbt build against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mimic
          POSTGRES_PASSWORD: mimic
          POSTGRES_DB: mimic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mimic"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: mimic
      WAREHOUSE_USER: mimic
      WAREHOUSE_PASSWORD: mimic
      LAKE_ROOT: /tmp/lake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements/dev.txt dbt-core==1.8.7 dbt-postgres==1.8.2

      - name: Create warehouse schemas
        run: psql "postgresql://mimic:mimic@localhost:5432/mimic" -f warehouse/init/01_schemas.sql

      # Build a real (small) lake, publish it, then let dbt model and test it.
      # This is the check that catches a Spark column rename breaking a mart.
      - name: Build lake from synthetic data
        run: |
          python scripts/generate_synthetic_mimic.py --patients 800 --out-dir /tmp/raw
          export PYTHONPATH=$PWD/spark
          python spark/jobs/bronze_ingest.py --source-dir /tmp/raw
          python spark/jobs/silver_transform.py
          python spark/jobs/gold_build.py

      - name: Publish gold to Postgres
        run: |
          export PYTHONPATH=$PWD/spark
          python spark/jobs/publish_warehouse.py

      - name: dbt build
        working-directory: dbt
        run: |
          dbt deps --profiles-dir .
          dbt run --profiles-dir . --target prod
          dbt test --profiles-dir . --target prod

      - name: Train downstream model
        run: python ml/train_angina_model.py --source warehouse --run-id ci-${{ github.run_id }}

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Spark image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/spark.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/airflow.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dags:
    name: Airflow DAG integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install "apache-airflow==2.10.3" \
            "apache-airflow-providers-apache-spark==4.11.2" \
            "apache-airflow-providers-postgres==5.13.1" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.3/constraints-3.11.txt"
      - name: Import every DAG and check for cycles
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
          PYTHONPATH: ${{ github.workspace }}/airflow/dags
        run: |
          airflow db migrate
          python - <<'PY'
          from airflow.models import DagBag
          bag = DagBag(dag_folder="airflow/dags", include_examples=False)
          assert not bag.import_errors, bag.import_errors
          print(f"{len(bag.dags)} DAGs parsed cleanly: {sorted(bag.dags)}")
          PY
